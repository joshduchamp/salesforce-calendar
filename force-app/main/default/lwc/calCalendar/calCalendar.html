<template>
    <div class="calendar">
        <c-cal-toolbar
            title={title}
            view={view}
            layout={layout}
            can-toggle-layout={canToggleLayout}
            ontoday={handleToday}
            onnavigate={handleNavigate}
            onviewchange={handleViewChange}
            onlayoutchange={handleLayoutChange}
        ></c-cal-toolbar>

        <div class={bodyClass}>
            <template if:true={showSidebar}>
                <aside class="calendar__sidebar">
                    <template if:true={showSourceList}>
                        <c-cal-source-list
                            calendars={sourceCalendars}
                            oncalendarvisibilitychange={handleVisibilityChange}
                        ></c-cal-source-list>
                    </template>
                    <template if:true={showLegend}>
                        <c-cal-legend
                            entries={legendEntries}
                            show-counts={showLegendCounts}
                        ></c-cal-legend>
                    </template>
                </aside>
            </template>

            <div
                class="calendar__view"
                oneventselect={handleEventSelect}
                oneventopen={handleEventOpen}
                oneventhover={handleEventHover}
                oneventhoverend={handleEventHoverEnd}
                onshowday={handleDrillToDay}
                ondayclick={handleDrillToDay}
            >
                <template if:true={isMonth}>
                    <c-cal-month-view
                        events={preparedEvents}
                        date={date}
                        first-day-of-week={firstDayOfWeek}
                        hide-weekends={hideWeekends}
                        field-config={fieldConfig}
                        max-events-per-day={maxEventsPerDay}
                        locale={locale}
                    ></c-cal-month-view>
                </template>

                <template if:true={isWeek}>
                    <c-cal-week-view
                        events={preparedEvents}
                        date={date}
                        layout={layout}
                        first-day-of-week={firstDayOfWeek}
                        hide-weekends={hideWeekends}
                        field-config={fieldConfig}
                        scheduler-start-hour={schedulerStartHour}
                        scheduler-end-hour={schedulerEndHour}
                        locale={locale}
                    ></c-cal-week-view>
                </template>

                <template if:true={isDay}>
                    <c-cal-day-view
                        events={preparedEvents}
                        date={date}
                        layout={layout}
                        field-config={fieldConfig}
                        scheduler-start-hour={schedulerStartHour}
                        scheduler-end-hour={schedulerEndHour}
                        locale={locale}
                    ></c-cal-day-view>
                </template>
            </div>
        </div>

        <template if:true={hoveredEvent}>
            <c-cal-event-popover
                event={hoveredEvent}
                field-config={fieldConfig}
                anchor={hoverAnchor}
                locale={locale}
            ></c-cal-event-popover>
        </template>
    </div>
</template>
