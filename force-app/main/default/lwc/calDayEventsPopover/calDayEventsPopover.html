<template>
    <div
        class="popover"
        style={panelStyle}
        role="dialog"
        aria-label={heading}
        onmouseenter={handleMouseEnter}
        onmouseleave={handleMouseLeave}
    >
        <div class="popover__header">
            <span class="popover__heading">{heading}</span>
            <button
                class="popover__close"
                type="button"
                title="Close"
                aria-label="Close"
                onclick={emitClose}
            >
                &times;
            </button>
        </div>
        <div class="popover__body">
            <template for:each={events} for:item="event">
                <c-cal-event-chip
                    key={event.id}
                    event={event}
                    field-config={fieldConfig}
                    view="month"
                    locale={locale}
                ></c-cal-event-chip>
            </template>
        </div>
    </div>
</template>
